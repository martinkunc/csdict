name: Release

# Push a version tag (e.g. "v1.2.0" or plain "1.2.0") to build all three platforms and publish a
# GitHub Release with one download per platform attached.
on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained win-x64
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          dotnet publish src/CSDict.App/CSDict.App.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$version -o publish/win-x64

      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Compress-Archive -Path publish/win-x64/* -DestinationPath "CSDict-$version-win-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CSDict-win-x64
          path: CSDict-*-win-x64.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained linux-x64
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/CSDict.App/CSDict.App.csproj -c Release -r linux-x64 --self-contained true \
            -p:Version="$version" -o publish/linux-x64

      - name: Zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd publish/linux-x64 && zip -r "$GITHUB_WORKSPACE/CSDict-$version-linux-x64.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: CSDict-linux-x64
          path: CSDict-*-linux-x64.zip

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - rid: osx-arm64
            arch_label: macos-arm64
          - rid: osx-x64
            arch_label: macos-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained ${{ matrix.rid }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/CSDict.App/CSDict.App.csproj -c Release -r ${{ matrix.rid }} --self-contained true \
            -p:Version="$version" -o publish/${{ matrix.rid }}

      # A plain `dotnet publish` output is just a folder of files - macOS only treats a directory
      # as a double-clickable, Applications-droppable app if it's a *.app bundle with this exact
      # Contents/{MacOS,Info.plist} layout. Ad-hoc codesigning (no Apple Developer certificate
      # involved) is enough to get past the *worst* Gatekeeper "app is damaged" failure mode, but
      # since it's not notarized, first launch will still need right-click -> Open.
      - name: Assemble CSDict.app
        run: |
          version="${GITHUB_REF_NAME#v}"
          app="CSDict.app"
          rm -rf "$app"
          mkdir -p "$app/Contents/MacOS"
          cp -R publish/${{ matrix.rid }}/. "$app/Contents/MacOS/"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>CSDict</string>
            <key>CFBundleDisplayName</key>
            <string>CSDict</string>
            <key>CFBundleIdentifier</key>
            <string>dev.csdict.CSDict</string>
            <key>CFBundleVersion</key>
            <string>$version</string>
            <key>CFBundleShortVersionString</key>
            <string>$version</string>
            <key>CFBundleExecutable</key>
            <string>CSDict.App</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST
          codesign --force --deep -s - "$app"

      - name: Build DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          rm -rf dmg-root
          mkdir dmg-root
          cp -R CSDict.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "CSDict" -srcfolder dmg-root -ov -format UDZO \
            "CSDict-$version-${{ matrix.arch_label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: CSDict-${{ matrix.arch_label }}
          path: CSDict-*.dmg

  create-release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"

          # If the tag's release already exists - e.g. it was drafted through the GitHub UI, which
          # is what created the tag and triggered this workflow in the first place - `gh release
          # create` would just fail with "a release with the same tag name already exists". Upload
          # the binaries onto that existing release instead of trying to create a second one.
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*/* --repo "$repo" --clobber
          else
            gh release create "$tag" artifacts/*/* \
              --repo "$repo" \
              --title "$tag" \
              --notes "$(cat <<'EOF'
          Automated release build.

          - **Windows (x64)** - unzip and run `CSDict.App.exe`.
          - **Linux (x64)** - unzip and run `CSDict.App`. Requires GTK 4 to already be installed via your package manager (e.g. `apt install libgtk-4-1`, `dnf install gtk4`, `pacman -S gtk4`).
          - **macOS (Apple Silicon / Intel)** - open the `.dmg` matching your Mac and drag `CSDict.app` into Applications. The app is ad-hoc signed but not notarized by Apple, so the first launch may need right-click -> Open (or `xattr -cr /Applications/CSDict.app`) to get past Gatekeeper.
          EOF
          )"
          fi
