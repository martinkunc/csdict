[package]
name = "dict-core"
version = "0.1.0"
edition = "2024"

[dependencies]
fst = { version = "0.4.7", features = ["levenshtein"] }
memmap2 = "0.9.12"
postcard = { version = "1.1.3", features = ["use-std"] }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
urlencoding = "2.1.3"
zstd = { version = "0.14.3", optional = true }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Writing packs (zstd compression, C library). Reading is pure Rust.
write = ["dep:zstd"]
