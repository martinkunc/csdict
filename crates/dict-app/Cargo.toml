[package]
name = "dict-app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dict-core = { version = "0.1.0", path = "../dict-core" }
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["json", "gzip"] }
urlencoding = "2.1.3"

[features]
default = ["tls"]
# HTTPS for downloads and online lookup (rustls + ring).
tls = ["ureq/rustls"]
# Developer aid: `EFRAME_SCREENSHOT_TO=out.png` saves a screenshot and exits.
screenshot = ["eframe/__screenshot", "eframe/glow"]

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }
