[package]
name = "dict-app"
version = "0.1.0"
edition = "2024"
description = "CSDict – a fast, cross-platform dictionary"

[[bin]]
name = "csdict"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dict-core = { version = "0.1.0", path = "../dict-core" }
directories = "6.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.0", default-features = false, features = ["json", "gzip"] }
sys-locale = "0.3.2"
urlencoding = "2.1.3"

[target.'cfg(target_os = "macos")'.dependencies]
# Minimizing the window directly (see `minimize` in app.rs).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow"] }

[features]
default = ["tls"]
# HTTPS for downloads and online lookup (rustls + ring).
tls = ["ureq/rustls"]
# Developer aid: `EFRAME_SCREENSHOT_TO=out.png` saves a screenshot and exits.
screenshot = ["eframe/__screenshot", "eframe/glow"]

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["eframe"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
