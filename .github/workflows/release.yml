name: Release

# Push a version tag (e.g. "v1.2.0" or plain "1.2.0") to build every platform and publish a
# GitHub Release with one download per platform attached. Dictionaries are NOT bundled: the app
# downloads them on demand from the rolling "dictionaries" release (build-dictionaries.yml).
on:
  push:
    tags:
      - "v*.*.*"
      - "*.*.*"
  workflow_dispatch: # test run: builds the packages as workflow artifacts, no release

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            target: x86_64-pc-windows-msvc
          # Oldest still-supported runner image -> binaries work on older glibc too.
          - os: ubuntu-22.04
            label: linux-x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            label: linux-arm64
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            label: macos-universal
            target: aarch64-apple-darwin x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.label }}

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          # The app reports this version (e.g. in its User-Agent). First match = [package].
          perl -0pi -e "s/^version = .*\$/version = \"$v\"/m" crates/dict-app/Cargo.toml
          grep -m1 '^version' crates/dict-app/Cargo.toml

      - name: Build
        shell: bash
        env:
          # Windows: link the C runtime statically (no VC++ redistributable needed).
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          for t in ${{ matrix.target }}; do
            cargo build --release -p dict-app --target "$t"
          done

      - name: Test
        shell: bash
        run: |
          targets="${{ matrix.target }}"
          cargo test --release --workspace --target "${targets%% *}"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging/windows.ps1 "target/${{ matrix.target }}/release/csdict.exe" "CSDict-$env:VERSION-${{ matrix.label }}.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux.sh "target/${{ matrix.target }}/release/csdict" "CSDict-$VERSION-${{ matrix.label }}.tar.gz"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          lipo -create -output csdict-universal \
            target/aarch64-apple-darwin/release/csdict target/x86_64-apple-darwin/release/csdict
          packaging/macos.sh csdict-universal "$VERSION" "CSDict-$VERSION-${{ matrix.label }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: CSDict-${{ matrix.label }}
          path: CSDict-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          # The release may already exist (drafted in the GitHub UI, which created the tag):
          # then just attach the files.
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/*/* --repo "$repo" --clobber
          else
            gh release create "$tag" artifacts/*/* \
              --repo "$repo" \
              --title "$tag" \
              --notes "$(cat <<'NOTES'
          Dictionaries are downloaded from within the app (**D** menu) – or looked up online until they are.

          - **Windows (x64)** – unzip and run `csdict.exe`.
          - **macOS (Apple Silicon and Intel)** – open the `.dmg` and drag `CSDict.app` into Applications. The app is ad-hoc signed, not notarized: on first start right-click → Open, or run `xattr -dr com.apple.quarantine /Applications/CSDict.app`.
          - **Linux (x64 / arm64)** – unpack and run `./csdict`. Run `./install-desktop-icon.sh` once to add a menu entry with icon. Pronunciation uses `espeak-ng` or speech-dispatcher plus `paplay` / `ffplay` / `mpv` if installed.
          NOTES
          )"
          fi
